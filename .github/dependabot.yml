version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Match pnpm's strict one-day minimum release age without weakening
    # security updates, which are not subject to Dependabot cooldowns.
    cooldown:
      default-days: 1
    ignore:
      # TypeScript versions are coordinated across the native TS7 CLI and
      # the programmatic TS6 API required by Angular and Octane.
      - dependency-name: typescript
      # Keep declarations aligned with the pinned Node 24 runtime.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # Vite+ owns its bundled runner; update this set through local vp migrate.
      # Independent Vitest upgrades split runner internals and browser providers.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: "@vitest/*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: vite
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      development-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
