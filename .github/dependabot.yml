version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Match pnpm's strict one-day minimum release age without weakening
    # security updates, which are not subject to Dependabot cooldowns.
    cooldown:
      default-days: 1
    ignore:
      # TypeScript versions are coordinated manually across the native TS7
      # checker, the TS6 compatibility alias, and Vue's TS5 SFC checker.
      - dependency-name: typescript
      # Keep declarations aligned with the pinned Node 24 runtime.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # Changesets 3 auto-detects the workspace oxfmt binary while versioning
      # and fails in the Linux release action. Keep compatible 2.x updates.
      - dependency-name: "@changesets/cli"
        update-types:
          - version-update:semver-major
      # Newer Octane releases require TypeScript 5.9, while this workspace's
      # compatibility checker is intentionally pinned to TypeScript 6.
      - dependency-name: octane
      - dependency-name: "@octanejs/vite-plugin"
    groups:
      development-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
