packages:
  - "apps/*"
  - "examples/*"
  - "packages/*"

peerDependencyRules:
  allowedVersions:
    "@qwik.dev/core@2.0.0-rc.0>vitest": "5.0.5"
    "octane@0.7.1>typescript": "6.0.2"
    # vite-plus-core 1.3.0 bundles Vite 8.3.4; its package version is not Vite semver.
    "@vitest/mocker@5.0.5>vite": "1.3.0"
    "vitest@5.0.5>vite": "1.3.0"
    "octane@0.7.1>vite": "1.3.0"
    "@octanejs/vite-plugin@0.1.62>vite": "1.3.0"
    "@qwik.dev/core@2.0.0-rc.0>vite": "1.3.0"
    "vitefu@1.1.3>vite": "1.3.0"
    "@sveltejs/vite-plugin-svelte@7.3.1>vite": "1.3.0"
    "@vitejs/plugin-vue@6.0.9>vite": "1.3.0"
    "vite-plugin-solid@2.11.14>vite": "1.3.0"

allowBuilds:
  esbuild: true

autoInstallPeers: false
blockExoticSubdeps: true
childConcurrency: 1
engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
nodeVersion: 24.18.0
pmOnFail: error
resolutionMode: highest
saveExact: true
strictDepBuilds: true
strictPeerDependencies: true
trustLockfile: false
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
verifyDepsBeforeRun: error

# Vite+ managed pins keep plugins and the bundled test runner on one copy.
overrides:
  "vite@*": "npm:@voidzero-dev/vite-plus-core@1.3.0"
  "vitest@*": "5.0.5"
  "octane@0.7.1>alien-signals": "3.2.1"
  # Security fixes for the current transitive graph; keep parent upgrades scoped.
  "undici@8.11.2": "8.12.3"
  "launch-editor@2.14.1": "2.14.2"
  "shell-quote@1.10.0": "1.11.0"
  "seroval@1.5.6": "1.6.11"
  "fast-uri@3.1.8": "3.1.9"
  "zod@4.4.3": "4.6.6"
  "zod@4.6.5": "4.6.6"
  "sharp@0.35.4": "0.35.5"
  "smol-toml@1.8.0": "1.9.0"
  "source-map-js@1.2.1": "1.2.2"
  "postcss-nested@6.2.0>postcss-selector-parser": "7.1.6"

patchedDependencies:
  alien-signals@3.2.1: patches/alien-signals@3.2.1.patch
