packages:
  - "apps/*"
  - "examples/*"
  - "packages/*"

peerDependencyRules:
  allowedVersions:
    "@qwik.dev/core@2.0.0-rc.0>vitest": "5.0.1"
    "octane@0.7.1>typescript": "6.0.2"
    # vite-plus-core 1.0.0 bundles Vite 8.3.1; its package version is not Vite semver.
    "@vitest/mocker@5.0.1>vite": "1.0.0"
    "vitest@5.0.1>vite": "1.0.0"
    "octane@0.7.1>vite": "1.0.0"
    "@octanejs/vite-plugin@0.1.62>vite": "1.0.0"
    "@qwik.dev/core@2.0.0-rc.0>vite": "1.0.0"
    "vitefu@1.1.3>vite": "1.0.0"
    "@sveltejs/vite-plugin-svelte@7.3.1>vite": "1.0.0"
    "@vitejs/plugin-vue@6.0.9>vite": "1.0.0"
    "vite-plugin-solid@2.11.14>vite": "1.0.0"

allowBuilds:
  esbuild: true

autoInstallPeers: false
blockExoticSubdeps: true
childConcurrency: 1
engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
nodeVersion: 24.18.0
pmOnFail: error
resolutionMode: highest
saveExact: true
strictDepBuilds: true
strictPeerDependencies: true
trustLockfile: false
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
verifyDepsBeforeRun: error

# Vite+ managed pins keep plugins and the bundled test runner on one copy.
overrides:
  "vite@*": "npm:@voidzero-dev/vite-plus-core@1.0.0"
  "vitest@*": "5.0.1"
  "octane@0.7.1>alien-signals": "3.2.1"

patchedDependencies:
  alien-signals@3.2.1: patches/alien-signals@3.2.1.patch
